<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aethelgard Sprite Debug Harness</title>
  <style>
    :root {
      --bg: #0a0812;
      --panel: #161426;
      --border: #302d4d;
      --text: #d0c8f0;
      --gold: #c8a45a;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      border-bottom: 2px solid var(--gold);
      margin-bottom: 20px;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 24px; color: var(--gold); }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { border-color: var(--gold); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
    }
    .char-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .char-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .char-name { font-weight: bold; font-size: 18px; color: var(--gold); }
    .char-id { font-family: monospace; opacity: 0.5; }
    
    .sprite-sheet-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 10px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 4px;
    }
    .frame-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .sprite-view {
      width: 96px;
      height: 96px;
      background-color: #222;
      background-image: 
        linear-gradient(45deg, #333 25%, transparent 25%),
        linear-gradient(-45deg, #333 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #333 75%),
        linear-gradient(-45deg, transparent 75%, #333 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 1px solid #444;
      image-rendering: pixelated;
    }
    .frame-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }
    
    /* Frame indicators */
    .f-idle    { background-position: 0% 0%; }
    .f-prepare { background-position: 50% 0%; }
    .f-attack  { background-position: 100% 0%; }
    .f-magic   { background-position: 0% 100%; }
    .f-hurt    { background-position: 50% 100%; }
    .f-fallen  { background-position: 100% 100%; }
    
    .quality-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--gold);
      color: var(--bg);
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <h1>Aethelgard Sprite Audit</h1>
  <div class="controls">
    <label>Quality: 
      <select id="quality-sel" onchange="refreshAll()">
        <option value="high">Normal (PNG)</option>
        <option value="low">Low (WebP)</option>
      </select>
    </label>
    <button onclick="refreshAll()">🔄 Refresh Grid</button>
  </div>
</header>

<div id="main-grid" class="grid">
  <!-- Dynamic Content -->
</div>

<!-- Load standard game scripts to reuse SpriteRenderer logic -->
<script src="js/utils.js"></script>
<script src="js/systems/settings-manager.js"></script>
<script src="js/sprites.js"></script>

<script>
  // Mock G and Settings if needed, or use the real ones
  const G = {
    settings: { graphicsQuality: 'high' }
  };

  async function loadChars() {
    const resp = await fetch('data/characters.json');
    return await resp.json();
  }

  const frames = ['idle', 'prepare', 'attack', 'magic', 'hurt', 'fallen'];

  async function refreshAll() {
    const quality = document.getElementById('quality-sel').value;
    Settings.update('quality', quality);
    
    const chars = await loadChars();
    const grid = document.getElementById('main-grid');
    grid.innerHTML = '';

    chars.forEach(char => {
      const card = document.createElement('div');
      card.className = 'char-card';
      
      let frameHtml = '';
      frames.forEach(f => {
        const spriteId = `spr-${char.id}-${f}`;
        frameHtml += `
          <div class="frame-box">
            <div id="${spriteId}" class="sprite-view f-${f}"></div>
            <div class="frame-label">${f}</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="char-header">
          <div>
            <span class="char-name">${char.name}</span>
            <span class="char-id">#${char.id}</span>
          </div>
          <span class="quality-badge">${quality.toUpperCase()}</span>
        </div>
        <div class="sprite-sheet-preview">
          ${frameHtml}
        </div>
      `;
      grid.appendChild(card);

      // Apply SpriteRenderer logic
      setTimeout(() => {
        frames.forEach(f => {
          const el = document.getElementById(`spr-${char.id}-${f}`);
          if (el) {
            // We use SpriteRenderer.setFrame to ensure it works exactly like in battle
            SpriteRenderer.setFrame(el, char.id, f, 96);
          }
        });
      }, 0);
    });
  }

  window.onload = refreshAll;
</script>

</body>
</html>
