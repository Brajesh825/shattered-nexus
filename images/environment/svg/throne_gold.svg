<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffea00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="royal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- Back Radiation -->
  <path d="M 32 32 L 10 5 L 54 5 Z" fill="url(#royal-glow)" />
