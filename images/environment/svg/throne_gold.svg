  <!-- Arms -->
  <path d="M 12 35 L 20 35 L 20 45 L 12 45 Z" fill="url(#gold)" stroke="#d97706" />
  <path d="M 44 35 L 52 35 L 52 45 L 44 45 Z" fill="url(#gold)" stroke="#d97706" />
  <!-- Legs -->
  <path d="M 14 45 L 10 60 L 18 60 Z" fill="#d97706" />
  <path d="M 50 45 L 54 60 L 46 60 Z" fill="#d97706" />
  <!-- Gemstones -->
  <circle cx="32" cy="12" r="2.5" fill="#e91e63" stroke="#fff" stroke-width="0.5" />
  <circle cx="15" cy="35" r="1.5" fill="#2196f3" />
  <circle cx="49" cy="35" r="1.5" fill="#2196f3" />
</svg>
