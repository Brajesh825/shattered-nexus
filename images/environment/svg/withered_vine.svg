<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vine-blur">
      <feGaussianBlur stdDeviation="0.5" />
    </filter>
  </defs>
  <!-- Gnarled Roots -->
  <path d="M32 60 Q20 50 25 30 Q15 20 10 10" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 60 Q44 50 39 30 Q49 20 54 10" fill="none" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corruption Spores -->
  <circle cx="25" cy="30" r="1.5" fill="#4a148c" opacity="0.6">
    <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="39" cy="30" r="1.2" fill="#4a148c" opacity="0.6">
    <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Thorns -->
  <path d="M25 45 L22 42 M39 45 L42 42 M20 25 L18 22" stroke="#000" stroke-width="1" opacity="0.4"/>
</svg>
