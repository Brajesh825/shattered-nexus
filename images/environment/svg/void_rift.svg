<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="rift-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ea80fc;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#aa00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:0" />
    </radialGradient>
    <filter id="void-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Horizon -->
  <path d="M5 32 Q32 12 59 32 Q32 52 5 32 Z" fill="#0d0a18" opacity="0.8"/>
  <!-- Glowing Rift -->
  <path d="M10 32 Q32 18 54 32 Q32 46 10 32 Z" fill="url(#rift-core)" filter="url(#void-glow)">
    <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Reality Fractures -->
  <path d="M15 32 L25 30 M39 32 L49 34 M32 20 L32 44" stroke="#e1bee7" stroke-width="1" opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,20; 20,0" dur="1s" repeatCount="indefinite"/>
  </path>
</svg>
