<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="magic-bloom">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <ellipse cx="32" cy="34" rx="30" ry="12" fill="#4a148c" opacity="0.12"/>
  <!-- Outer Rings -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="2,4">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#e1bee7" stroke-width="0.5" opacity="0.4"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ce93d8" stroke-width="0.8" stroke-dasharray="6,3" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="360 32 32" to="0 32 32" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- Pentagram/Sigil -->
  <path d="M32 8 L54 48 L10 48 Z" fill="none" stroke="#ba68c8" stroke-width="1" filter="url(#magic-bloom)"/>
  <path d="M32 56 L10 16 L54 16 Z" fill="none" stroke="#ba68c8" stroke-width="1" filter="url(#magic-bloom)"/>
  <path d="M32 13 L35 19 L41 18 L38 24 L43 29 L36 30 L32 36 L28 30 L21 29 L26 24 L23 18 L29 19 Z" fill="none" stroke="#f3e5f5" stroke-width="0.7" opacity="0.65"/>
  <g fill="#f3e5f5" opacity="0.75">
    <circle cx="32" cy="8" r="1.2"/>
    <circle cx="54" cy="48" r="1.2"/>
    <circle cx="10" cy="48" r="1.2"/>
    <circle cx="10" cy="16" r="1"/>
    <circle cx="54" cy="16" r="1"/>
  </g>
  <!-- Core Pulse -->
  <circle cx="32" cy="32" r="4" fill="#f3e5f5" filter="url(#magic-bloom)">
    <animate attributeName="r" values="4; 8; 4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 0.5; 1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
