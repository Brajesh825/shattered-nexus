<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4d3865;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2240;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background shadow -->
  <path d="M10,80 L50,40 L90,80 Z" fill="#1a1428" opacity="0.5" />
  <!-- Steps -->
  <rect x="20" y="70" width="60" height="10" fill="url(#stepGrad)" stroke="#6200ea" stroke-width="1" rx="2" />
  <rect x="30" y="60" width="40" height="10" fill="url(#stepGrad)" stroke="#6200ea" stroke-width="1" rx="2" />
  <rect x="40" y="50" width="20" height="10" fill="url(#stepGrad)" stroke="#6200ea" stroke-width="1" rx="2" />
  <!-- Portal Light -->
  <circle cx="50" cy="45" r="5" fill="#b388ff">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
