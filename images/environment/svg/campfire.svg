<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fire-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff176;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d84315;stop-opacity:0" />
    </radialGradient>
    <filter id="heat-haze">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  <!-- Logs -->
  <rect x="20" y="52" width="24" height="4" rx="2" fill="#3e2723" transform="rotate(-15 32 54)"/>
  <rect x="20" y="52" width="24" height="4" rx="2" fill="#5d4037" transform="rotate(15 32 54)"/>
  <!-- Glowing Embers -->
  <circle cx="32" cy="54" r="8" fill="#bf360c" filter="url(#heat-haze)" opacity="0.6">
    <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Flames -->
  <path d="M32 54 Q25 35 32 15 Q39 35 32 54" fill="url(#fire-grad)" filter="url(#heat-haze)">
    <animate attributeName="d" values="M32 54 Q25 35 32 15 Q39 35 32 54; M32 54 Q28 40 32 10 Q36 40 32 54; M32 54 Q25 35 32 15 Q39 35 32 54" dur="0.6s" repeatCount="indefinite"/>
  </path>
  <path d="M32 54 Q28 40 32 25 Q36 40 32 54" fill="#fffde7" opacity="0.6">
    <animate attributeName="d" values="M32 54 Q28 40 32 25 Q36 40 32 54; M32 54 Q30 42 32 20 Q34 42 32 54; M32 54 Q28 40 32 25 Q36 40 32 54" dur="0.5s" repeatCount="indefinite"/>
  </path>
</svg>
