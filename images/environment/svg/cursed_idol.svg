<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#37474f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="eye-glow">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Idol Body -->
  <path d="M20 56 L32 12 L44 56 Z" fill="url(#obsidian)"/>
  <path d="M20 56 Q32 50 44 56" fill="#1a1a1b"/>
  <!-- Glowing Runes -->
  <path d="M30 30 L34 30 M32 35 L32 45" stroke="#f44336" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <!-- Eyes -->
  <circle cx="30" cy="22" r="1.5" fill="#ff5252" filter="url(#eye-glow)"/>
  <circle cx="34" cy="22" r="1.5" fill="#ff5252" filter="url(#eye-glow)"/>
  <!-- Rim Light -->
  <path d="M32 12 L22 50" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.2"/>
</svg>
