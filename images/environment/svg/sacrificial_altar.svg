<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="altar-stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#455a64;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#263238;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Slab -->
  <rect x="12" y="44" width="40" height="12" rx="2" fill="url(#altar-stone)"/>
  <rect x="10" y="52" width="44" height="6" fill="#1a1a1b"/>
  <!-- Blood/Sacrifice Marks -->
  <path d="M20 44 Q32 48 44 44" fill="none" stroke="#d32f2f" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.2; 0.5; 0.2" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- Runic Side -->
  <path d="M15 48 L20 48 M44 48 L49 48" stroke="#9c27b0" stroke-width="1" opacity="0.3"/>
</svg>
