<svg version="1.1" id="GameAsset_Granary" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 100 135" style="enable-background:new 0 0 100 135;" xml:space="preserve">
<style type="text/css">
	.st0{fill:#233036;} /* Dark Outline/Detail */
	.st1{fill:#90A4AE;} /* Main Hull Color (Light Teal-Grey) */
	.st2{fill:#607D8B;} /* Domed Roof Color (Mid Teal-Grey) */
	.st3{fill:#B0BEC5;} /* Panel Shine/Highlight */
</style>

<!-- Main Hull Panels and Ribs -->
<g id="Hull_Group">
	<path class="st0" d="M10,132.5h80v-85c0-1.4-1.1-2.5-2.5-2.5h-75c-1.4,0-2.5,1.1-2.5,2.5V132.5z"/>
	<rect x="12.5" y="47.5" class="st1" width="75" height="82.5"/>
	
	<!-- Horizontal Panel Lines -->
	<g opacity="0.3">
		<rect x="12.5" y="67.5" class="st0" width="75" height="1.5"/>
		<rect x="12.5" y="87.5" class="st0" width="75" height="1.5"/>
		<rect x="12.5" y="107.5" class="st0" width="75" height="1.5"/>
	</g>
	
	<!-- Vertical Center Rib (With subtle shine) -->
	<rect x="49.2" y="47.5" class="st0" width="1.7" height="82.5"/>
	<rect x="50" y="47.5" class="st3" width="0.8" height="82.5"/>
</g>

<!-- Roof and Vane Complex -->
<g id="Roof_Group">
	<!-- Domed Roof with Outline -->
	<path class="st0" d="M10,47.5c0-11,17.9-20,40-20s40,9,40,20s-17.9,20-40,20S10,58.5,10,47.5z"/>
	<path class="st2" d="M12.5,47.5c0-9.7,16.8-17.5,37.5-17.5s37.5,7.8,37.5,17.5s-16.8,17.5-37.5,17.5S12.5,57.2,12.5,47.5z"/>
	
	<!-- Roof Access Hatch -->
	<g transform="translate(65, 45)">
		<rect class="st0" width="12" height="10" rx="1"/>
		<rect x="1.5" y="1.5" class="st1" width="9" height="7" rx="1"/>
	</g>

	<!-- Weather Vane Base and Spindle -->
	<rect x="48.5" y="15" class="st0" width="3" height="12.5"/>
	
	<!-- Rooster Silhouette Vane -->
	<g id="Rooster_Vane_Group" transform="translate(50, 15) scale(1.1)">
		<g transform="translate(-5,-10)">
			<path class="st0" d="M9.8,1.4C9.2,0.8,8.2,0.6,7.5,1C6.9,1.3,6.5,2,6.5,2.7s0.4,1.4,1,1.7s1.3-0.1,1.6-0.8c0,0,0,0,0,0L9.8,1.4z"/>
			<path class="st0" d="M6,3C6.3,2.8,6.5,2.4,6.5,2c0-0.6-0.4-1-1-1S4.5,1.4,4.5,2c0,0.4,0.3,0.8,0.5,1c0,0,0,0,0,0L6,3z"/>
			<path class="st0" d="M10,6c0-1.1-0.9-2-2-2s-2,0.9-2,2c0,0.8,0.5,1.5,1.1,1.8l-1.1,1.1l0.6,0.6l1.1-1.1c0.3,0.1,0.6,0.2,0.9,0.2C9.1,8,10,7.1,10,6z"/>
			<path class="st0" d="M10,6.5L10,6.5c1.1,0,2,0.9,2,2c0,1.1-0.9,2-2,2l0,0C8.9,10.5,8,9.6,8,8.5C8,7.4,8.9,6.5,10,6.5z"/>
			<path class="st0" d="M12,8.5L12,8.5c1.1,0,2,0.9,2,2c0,1.1-0.9,2-2,2l0,0C10.9,12.5,10,11.6,10,10.5C10,9.4,10.9,8.5,12,8.5z"/>
		</g>
	</g>
</g>

<!-- Ladder System -->
<g id="Ladder_Group" fill="none" stroke="#233036" stroke-width="2">
	<!-- Main rails -->
	<line x1="72" y1="48" x2="72" y2="132"/>
	<line x1="82" y1="48" x2="82" y2="132"/>
	<!-- Rungs (simplified for scale) -->
	<g stroke-width="1.5">
		<line x1="72" y1="55" x2="82" y2="55"/>
		<line x1="72" y1="70" x2="82" y2="70"/>
		<line x1="72" y1="85" x2="82" y2="85"/>
		<line x1="72" y1="100" x2="82" y2="100"/>
		<line x1="72" y1="115" x2="82" y2="115"/>
	</g>
</g>

<!-- Access Door -->
<g id="Door_Group" transform="translate(40, 75)">
	<rect class="st0" width="20" height="40" rx="3"/>
	<rect x="2" y="2" class="st2" width="16" height="36" rx="2"/>
	<circle class="st0" cx="15" cy="20" r="1.5"/> <!-- Handle -->
</g>

<!-- Discharge Chute -->
<g id="Chute_Group" transform="translate(10, 110) rotate(-15)">
	<rect class="st0" width="10" height="20" rx="2"/>
	<rect x="1" y="1" class="st1" width="8" height="18" rx="1"/>
	<circle class="st0" cx="10" cy="10" r="6"/> <!-- Nozzle -->
</g>

</svg>
