<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="weathered-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#795548;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Platform -->
  <rect x="8" y="50" width="48" height="14" fill="url(#weathered-wood)" stroke="#2d1d1a" stroke-width="1.5" />
  <rect x="12" y="50" width="40" height="2" fill="rgba(0,0,0,0.4)" />
  <!-- Posts -->
  <rect x="12" y="10" width="4" height="40" fill="#3e2723" />
  <rect x="48" y="10" width="4" height="40" fill="#3e2723" />
