<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="flower-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4081;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Leaves -->
  <path d="M32 50 Q20 50 15 40 Q20 30 32 50" fill="#388e3c" opacity="0.6"/>
  <path d="M32 50 Q44 50 49 40 Q44 30 32 50" fill="#388e3c" opacity="0.6"/>
  <!-- Petals -->
  <circle cx="32" cy="30" r="8" fill="url(#flower-grad)"/>
  <circle cx="24" cy="35" r="7" fill="url(#flower-grad)" opacity="0.9"/>
  <circle cx="40" cy="35" r="7" fill="url(#flower-grad)" opacity="0.9"/>
  <circle cx="32" cy="42" r="8" fill="url(#flower-grad)" opacity="0.8"/>
  <!-- Core -->
  <circle cx="32" cy="35" r="3" fill="#ffeb3b">
    <animate attributeName="r" values="3; 4; 3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
