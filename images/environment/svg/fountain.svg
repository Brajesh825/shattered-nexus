<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="basin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cfd8dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78909c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Lower Basin -->
  <ellipse cx="32" cy="52" rx="20" ry="8" fill="url(#basin)"/>
  <ellipse cx="32" cy="52" rx="18" ry="6" fill="#0288d1" opacity="0.4"/>
  <!-- Column -->
  <rect x="28" y="32" width="8" height="20" fill="url(#basin)"/>
  <!-- Upper Basin -->
  <ellipse cx="32" cy="32" rx="12" ry="5" fill="url(#basin)"/>
  <ellipse cx="32" cy="32" rx="10" ry="4" fill="#03a9f4" opacity="0.6"/>
  <!-- Water Spout -->
  <path d="M32 20 L32 32" stroke="#e1f5fe" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0,12; 12,0" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <!-- Ripples -->
  <circle cx="32" cy="52" r="5" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5">
    <animate attributeName="r" values="5; 15" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5; 0" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
