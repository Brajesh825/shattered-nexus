<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crys-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ea80fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:1" />
    </radialGradient>
    <filter id="crys-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <ellipse cx="32" cy="58" rx="18" ry="4" fill="#3f1d7a" opacity="0.22"/>
  <!-- Crystal Shard -->
  <path d="M32 10 L20 32 L32 54 L44 32 Z" fill="url(#crys-grad)" filter="url(#crys-glow)" stroke="#e9b7ff" stroke-width="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Internal Reflections -->
  <path d="M32 15 L24 32 L32 49 L40 32 Z" fill="#fff" opacity="0.2">
    <animate attributeName="opacity" values="0.1; 0.4; 0.1" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M32 10 L32 54 M20 32 L32 36 L44 32" stroke="#ffffff" stroke-width="0.7" opacity="0.45"/>
  <path d="M25 31 L32 15 L39 31" fill="none" stroke="#f3d4ff" stroke-width="0.7" opacity="0.5"/>
  <!-- Particles -->
  <circle cx="20" cy="20" r="1" fill="#ea80fc">
    <animate attributeName="cy" values="20; 10; 20" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="40" r="1.2" fill="#ea80fc">
    <animate attributeName="cy" values="40; 30; 40" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="23" r="0.8" fill="#f3d4ff">
    <animate attributeName="cy" values="23; 16; 23" dur="2.1s" repeatCount="indefinite"/>
  </circle>
</svg>
