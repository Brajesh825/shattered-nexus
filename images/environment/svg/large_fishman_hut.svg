<circle cx="366" cy="344" r="4" fill="#c8a44a"/>
<circle cx="366" cy="344" r="2.5" fill="#dbb96a"/>
<!-- Door frame highlight -->
<line x1="326" y1="303" x2="326" y2="377" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

<!-- ═══════════════════════════ WINDOWS ═══════════════════════════ -->
<!-- Left window -->
<rect x="272" y="248" width="56" height="46" rx="3" fill="#1c130a"/>
<!-- Window glow -->
<rect x="275" y="251" width="50" height="40" rx="2" fill="url(#windowGlow)" opacity="0.8"/>
<!-- Window panes (cross) -->
<line x1="300" y1="251" x2="300" y2="291" stroke="#4a2e10" stroke-width="2.5"/>
<line x1="275" y1="271" x2="325" y2="271" stroke="#4a2e10" stroke-width="2.5"/>
<!-- Window frame -->
<rect x="272" y="248" width="56" height="46" rx="3" fill="none" stroke="#5c3d1e" stroke-width="3"/>
<!-- Window shutter left -->
<rect x="258" y="246" width="14" height="50" rx="2" fill="#7a4f2d"/>
<rect x="258" y="246" width="14" height="50" rx="2" fill="url(#plankH)" opacity="0.5"/>
<rect x="259" y="258" width="12" height="5" rx="1" fill="#5c3519" opacity="0.6"/>
<rect x="259" y="272" width="12" height="5" rx="1" fill="#5c3519" opacity="0.6"/>

<!-- Right window -->
