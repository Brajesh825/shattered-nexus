<line x1="375" y1="271" x2="425" y2="271" stroke="#4a2e10" stroke-width="2.5"/>
<rect x="372" y="248" width="56" height="46" rx="3" fill="none" stroke="#5c3d1e" stroke-width="3"/>
<!-- Window shutter right -->
<rect x="428" y="246" width="14" height="50" rx="2" fill="#7a4f2d"/>
<rect x="428" y="246" width="14" height="50" rx="2" fill="url(#plankH)" opacity="0.5"/>
<rect x="429" y="258" width="12" height="5" rx="1" fill="#5c3519" opacity="0.6"/>
<rect x="429" y="272" width="12" height="5" rx="1" fill="#5c3519" opacity="0.6"/>

