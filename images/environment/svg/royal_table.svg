<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="velvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Table Legs -->
  <rect x="10" y="45" width="6" height="15" fill="#2d1d1a" />
  <rect x="48" y="45" width="6" height="15" fill="#2d1d1a" />
  <rect x="14" y="40" width="4" height="10" fill="#1a110e" />
  <rect x="46" y="40" width="4" height="10" fill="#1a110e" />
  <!-- Table Top Shadow -->
  <rect x="4" y="38" width="56" height="8" rx="2" fill="rgba(0,0,0,0.4)" />
  <!-- Table Top -->
  <rect x="4" y="32" width="56" height="8" rx="2" fill="url(#wood)" stroke="#1a110e" stroke-width="1"/>
  <!-- Velvet Runner -->
  <path d="M 20 32 L 44 32 L 44 55 Q 32 60 20 55 Z" fill="url(#velvet)" stroke="#ffd700" stroke-width="0.5" />
  <!-- Gold Details -->
  <circle cx="32" cy="40" r="2" fill="#ffd700" />
  <rect x="22" y="32" width="20" height="2" fill="rgba(255,215,0,0.3)" />
