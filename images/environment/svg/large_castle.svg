  <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4b5563"/>
    <stop offset="100%" stop-color="#1f2937"/>
  </linearGradient>
  <pattern id="stoneTex" width="20" height="16" patternUnits="userSpaceOnUse">
