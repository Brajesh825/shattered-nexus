<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6b7280"/>
    <stop offset="100%" stop-color="#374151"/>
