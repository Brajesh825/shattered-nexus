<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="obelisk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#37474f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#546e7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#37474f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect x="22" y="50" width="20" height="10" fill="#263238"/>
  <!-- Body -->
  <path d="M24 50 L32 8 L40 50 Z" fill="url(#obelisk-grad)"/>
  <!-- Glowing Capstone -->
  <path d="M30 18 L32 8 L34 18 Z" fill="#64b5f6" opacity="0.6">
    <animate attributeName="opacity" values="0.4; 0.9; 0.4" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Runic Engravings -->
  <path d="M31 25 L33 25 M32 30 L32 40" stroke="#90caf9" stroke-width="1" opacity="0.3"/>
</svg>
