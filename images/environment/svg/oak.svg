<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <defs>
    <linearGradient id="trunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a3520"/>
      <stop offset="100%" style="stop-color:#2d1a0a"/>
    </linearGradient>
    <radialGradient id="leaves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4d9a30"/>
      <stop offset="70%" style="stop-color:#2d5a1e"/>
      <stop offset="100%" style="stop-color:#1a3510"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Trunk -->
  <path d="M45 110 L55 110 L53 80 L47 80 Z" fill="url(#trunk)"/>
  <!-- Canopy -->
  <circle cx="50" cy="50" r="35" fill="url(#leaves)" filter="url(#shadow)"/>
  <circle cx="35" cy="65" r="25" fill="url(#leaves)" filter="url(#shadow)"/>
  <circle cx="65" cy="65" r="25" fill="url(#leaves)" filter="url(#shadow)"/>
  <circle cx="50" cy="30" r="20" fill="url(#leaves)" filter="url(#shadow)"/>
</svg>
