<svg width="100" height="150" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Shadow -->
  <ellipse cx="50" cy="140" rx="30" ry="8" fill="#000" opacity="0.2"/>

  <!-- Main Trunk (Bleached) -->
  <path d="M45 140 Q50 100 40 70 L55 70 Q50 110 55 140 Z" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="2"/>
  
  <!-- Dead Branches -->
  <path d="M40 70 Q20 50 10 60" stroke="#e2e8f0" stroke-width="3" fill="none"/>
  <path d="M55 70 Q80 50 90 65" stroke="#e2e8f0" stroke-width="3" fill="none"/>
  <path d="M48 85 Q65 95 75 80" stroke="#e2e8f0" stroke-width="2" fill="none"/>
  <path d="M45 100 Q30 110 20 95" stroke="#e2e8f0" stroke-width="2" fill="none"/>

  <!-- Void Infusion (Glowing veins) -->
  <path d="M48 140 L50 110 L47 80" stroke="#6a1b9a" stroke-width="1.5" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" />
  </path>
</svg>
