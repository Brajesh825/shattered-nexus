<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flask-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#80deea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00838f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="potion-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a5d6a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Table Legs -->
  <rect x="10" y="40" width="4" height="20" fill="#3e2723" />
  <rect x="50" y="40" width="4" height="20" fill="#3e2723" />
  <!-- Table Surface -->
  <rect x="4" y="30" width="56" height="10" rx="2" fill="#5d4037" stroke="#2d1d1a" stroke-width="1.5" />
  <!-- Drawer -->
  <rect x="22" y="34" width="20" height="4" rx="1" fill="#3e2723" />
  <circle cx="32" cy="36" r="0.8" fill="#ffd700" />
  <!-- Flasks -->
  <path d="M 15 30 L 15 25 Q 15 20 12 20 L 18 20 Q 15 20 15 25 Z" fill="url(#flask-blue)" stroke="#006064" stroke-width="0.5" />
  <circle cx="15" cy="22" r="4" fill="url(#flask-blue)" stroke="#006064" stroke-width="0.5" />
  
  <path d="M 45 30 L 45 22 Q 45 15 42 15 L 48 15 Q 45 15 45 22 Z" fill="url(#potion-green)" stroke="#1b5e20" stroke-width="0.5" />
  <rect x="42" y="20" width="6" height="10" rx="1" fill="url(#potion-green)" stroke="#1b5e20" stroke-width="0.5" />
  <!-- Scroll -->
  <rect x="25" y="22" width="12" height="8" rx="1" fill="#fff9c4" stroke="#fbc02d" stroke-width="0.5" transform="rotate(-10 31 26)" />
  <!-- Bubbles -->
  <circle cx="15" cy="18" r="0.5" fill="#fff" opacity="0.6" />
  <circle cx="45" cy="15" r="0.5" fill="#fff" opacity="0.6" />
</svg>
