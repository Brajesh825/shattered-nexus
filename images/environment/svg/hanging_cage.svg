<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cage-iron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#37474f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#101416;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Chain -->
  <path d="M 32 0 L 32 15" stroke="#263238" stroke-width="2" stroke-dasharray="3,1" />
  <circle cx="32" cy="15" r="3" fill="none" stroke="#263238" stroke-width="1.5" />
  <!-- Cage Top -->
  <path d="M 16 25 Q 32 15 48 25" fill="none" stroke="url(#cage-iron)" stroke-width="2.5" />
  <!-- Vertical Bars -->
  <rect x="18" y="25" width="1.5" height="30" fill="#212121" />
  <rect x="25" y="22" width="1.5" height="36" fill="#212121" />
  <rect x="32" y="20" width="1.5" height="40" fill="#212121" />
  <rect x="39" y="22" width="1.5" height="36" fill="#212121" />
  <rect x="46" y="25" width="1.5" height="30" fill="#212121" />
  <!-- Horizontal Rings -->
  <path d="M 16 35 Q 32 30 48 35" fill="none" stroke="#263238" stroke-width="1.5" />
  <path d="M 16 50 Q 32 45 48 50" fill="none" stroke="#263238" stroke-width="1.5" />
  <!-- Base -->
  <rect x="16" y="55" width="32" height="4" rx="1" fill="url(#cage-iron)" stroke="#000" stroke-width="1" />
  <!-- Highlights -->
  <path d="M 32 22 L 32 25" stroke="#fff" opacity="0.3" stroke-width="0.5" />
</svg>
