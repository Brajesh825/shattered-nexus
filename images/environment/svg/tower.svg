<svg width="100" height="150" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Foundation Shadow -->
  <ellipse cx="50" cy="140" rx="40" ry="10" fill="#000" opacity="0.4"/>

  <!-- Main Tower Body -->
  <path d="M25 140 L75 140 L70 30 L30 30 Z" fill="url(#towerGrad)" stroke="#111" stroke-width="2"/>
  
  <!-- Brick Texture (Detail) -->
  <g fill="#718096" opacity="0.2">
    <rect x="35" y="120" width="8" height="4"/>
    <rect x="55" y="110" width="8" height="4"/>
    <rect x="32" y="90" width="8" height="4"/>
    <rect x="60" y="80" width="8" height="4"/>
    <rect x="38" y="60" width="8" height="4"/>
    <rect x="52" y="45" width="8" height="4"/>
  </g>

  <!-- Upper Battlements -->
  <path d="M25 35 L25 15 L35 15 L35 25 L45 25 L45 15 L55 15 L55 25 L65 25 L65 15 L75 15 L75 35 Z" fill="#1a202c" stroke="#000" stroke-width="2"/>
  
  <!-- Emerald Beacon -->
  <rect x="25" y="30" width="50" height="3" fill="#4ade80" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" />
  </rect>

  <!-- Arrow Slit Windows -->
  <rect x="47" y="50" width="6" height="15" rx="3" fill="#000"/>
  <rect x="47" y="50" width="6" height="15" rx="3" fill="#4ade80" opacity="0.3"/>
  <rect x="47" y="85" width="6" height="15" rx="3" fill="#000"/>

  <!-- Emerald Flag -->
  <line x1="50" y1="15" x2="50" y2="0" stroke="#8d6e63" stroke-width="2"/>
  <path d="M50 0 L75 8 L50 16 Z" fill="#4ade80" stroke="#2d6a4f" stroke-width="1">
    <animate attributeName="d" values="M50 0 L75 8 L50 16 Z; M50 0 L70 12 L50 16 Z; M50 0 L75 8 L50 16 Z" dur="1.5s" repeatCount="indefinite" />
  </path>
</svg>
