<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bridge-planks" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Platform -->
  <rect x="4" y="0" width="56" height="64" rx="2" fill="url(#bridge-planks)" stroke="#2d1d1a" stroke-width="2" />
  <!-- Planks Lines -->
  <path d="M 4 16 L 60 16 M 4 32 L 60 32 M 4 48 L 60 48" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" />
  <!-- Iron Bands -->
  <rect x="8" y="0" width="4" height="64" fill="#263238" opacity="0.8" />
  <rect x="52" y="0" width="4" height="64" fill="#263238" opacity="0.8" />
  <!-- Chains -->
  <path d="M 10 0 L 10 64" stroke="#455a64" stroke-width="2.5" stroke-dasharray="4,2" opacity="0.6" />
  <path d="M 54 0 L 54 64" stroke="#455a64" stroke-width="2.5" stroke-dasharray="4,2" opacity="0.6" />
  <!-- Rivets -->
  <circle cx="10" cy="16" r="1.5" fill="#37474f" />
  <circle cx="54" cy="16" r="1.5" fill="#37474f" />
  <circle cx="10" cy="48" r="1.5" fill="#37474f" />
  <circle cx="54" cy="48" r="1.5" fill="#37474f" />
</svg>
